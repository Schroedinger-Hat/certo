apiVersion: v1
kind: Secret
metadata:
  name: {{ include "certo.secretName" . }}
  labels:
    {{- include "certo.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ include "certo.secretValue" (dict "root" $ "explicit" .Values.secrets.jwtSecret "key" "JWT_SECRET" "length" 32) | quote }}
  ADMIN_JWT_SECRET: {{ include "certo.secretValue" (dict "root" $ "explicit" .Values.secrets.adminJwtSecret "key" "ADMIN_JWT_SECRET" "length" 32) | quote }}
  APP_KEYS: {{ include "certo.secretValue" (dict "root" $ "explicit" .Values.secrets.appKeys "key" "APP_KEYS" "length" 32) | quote }}
  API_TOKEN_SALT: {{ include "certo.secretValue" (dict "root" $ "explicit" .Values.secrets.apiTokenSalt "key" "API_TOKEN_SALT" "length" 32) | quote }}
  TRANSFER_TOKEN_SALT: {{ include "certo.secretValue" (dict "root" $ "explicit" .Values.secrets.transferTokenSalt "key" "TRANSFER_TOKEN_SALT" "length" 32) | quote }}
  ENCRYPTION_KEY: {{ include "certo.secretValue" (dict "root" $ "explicit" .Values.secrets.encryptionKey "key" "ENCRYPTION_KEY" "length" 32) | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_PASSWORD: {{ include "certo.secretValue" (dict "root" $ "explicit" .Values.postgresql.password "key" "DATABASE_PASSWORD" "length" 24) | quote }}
  {{- end }}
