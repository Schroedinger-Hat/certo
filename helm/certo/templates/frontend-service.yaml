apiVersion: v1
kind: Service
metadata:
  name: {{ include "certo.frontend.fullname" . }}
  labels:
    {{- include "certo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "certo.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
